<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Velor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">VELOR</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/contact">Contact</a></li>
                <li class="cart-icon" onclick="window.location.href='/cart'">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="cart-count" style="display: none;">0</span>
                </li>
                <li class="auth-buttons">
                    <button class="btn btn-outline" onclick="openModal('loginModal')">Login</button>
                    <button class="btn btn-primary" onclick="openModal('registerModal')">Register</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="container" style="padding-top: 3rem;">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2rem; font-weight: 300; letter-spacing: 3px;">Contact Us</h2>
            <p style="text-align: center; color: var(--secondary-gray); margin-bottom: 2rem;">
                Have a question or want to get in touch? We'd love to hear from you.
            </p>
            <form id="contactForm" onsubmit="event.preventDefault(); submitContact();">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="contactSubject" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="contactMessage" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--secondary-gray); font-size: 0.9rem;">
                Note: You must be logged in to send a message.
            </p>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Login</h2>
                <button class="close-modal" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <form onsubmit="event.preventDefault(); login();">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Register</h2>
                <button class="close-modal" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <form onsubmit="event.preventDefault(); register();">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Velor. All rights reserved.</p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/contact.js"></script>
</body>
</html>
